<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend Day ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

<!-- Floating Hearts -->
<div id="hearts"></div>

<!-- Password Screen -->
<section id="lockScreen">

<div class="lock-box">

<h1>🔒 Private Website</h1>

<p>Enter Password</p>

<input
type="password"
id="password"
placeholder="Password">

<button onclick="unlockWebsite()">
Unlock ❤️
</button>

<p id="error"></p>

</div>

</section>

<!-- Main Website -->
<div id="mainWebsite">

<!-- Hero Section -->

<section class="hero">

<h1>
Happy Girlfriend Day
</h1>

<h2>
Sanhya ❤️
</h2>

<p>
From Shivansh
</p>

</section>

<!-- Teddy Section -->

<section class="teddy-section">

<img
src="assets/teddy1.gif"
class="teddy left">

<img
src="assets/teddy2.gif"
class="teddy right">

</section>

<!-- Timer -->

<section class="timer">

<h2>
Together Since ❤️
</h2>

<div id="countdown"></div>

</section>

<!-- Love Letter -->

<section class="letter">

<h2>
My Love Letter 💌
</h2>

<p id="typewriter"></p>

</section>

<!-- Surprise -->

<section class="surprise">

<button id="surpriseBtn">

Forever & Always ❤️

</button>

</section>

<!-- Music -->

<audio
id="music"
loop>

<source
src="assets/IshqSufiyana.mp3"
type="audio/mpeg">

</audio>

</div>

<script src="script.js"></script>

</body>
</html>
